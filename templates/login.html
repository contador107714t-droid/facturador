<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login | Facturador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px;">
  <h2>Ingresar</h2>

  {% if error %}
    <div style="background:#ffecec;border:1px solid #ffb3b3;padding:10px;border-radius:10px;margin:12px 0;">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Usuario</label><br>
    <input name="username" required style="width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px;"><br>

    <label>Contraseña</label><br>
    <input name="password" type="password" required style="width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px;"><br>

    <button type="submit" style="width:100%;padding:10px;border:0;border-radius:10px;cursor:pointer;">
      Entrar
    </button>
  </form>
</body>
</html>
