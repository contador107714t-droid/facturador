{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Grupos de inventario</h2>
    <a class="btn btn-primary" href="/grupos/nuevo">Nuevo grupo</a>
</div>
{% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

<div class="card p-3">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>ID</th><th>Nombre</th><th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for g in grupos %}
                <tr>
                    <td>{{ g.id }}</td>
                    <td>{{ g.nombre }}</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" href="/grupos/editar/{{ g.id }}">Editar</a>
                        <form method="post" action="/grupos/eliminar/{{ g.id }}" class="d-inline" onsubmit="return confirm('Eliminar grupo?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
